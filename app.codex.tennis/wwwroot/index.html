<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#216144" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tennis" />
    <title>Social Tennis</title>
    <base href="/" />
    <script src="theme.js"></script>
    <script src="players.js"></script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/tennis-180.png" />
    <link rel="icon" type="image/png" href="icons/tennis-192.png" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="app.codex.tennis.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>
<body>
    <div id="app"><div class="loading" role="status">Loading…</div></div>
    <div id="blazor-error-ui" role="alert">Something went wrong. <a href=".">Reload</a></div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            const alreadyControlled = Boolean(navigator.serviceWorker.controller);
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (alreadyControlled && !refreshing) {
                    refreshing = true;
                    location.reload();
                }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .then(registration => registration.update().catch(() => { /* Offline updates can wait. */ }))
                .catch(console.error);
        }
    </script>
</body>
</html>
